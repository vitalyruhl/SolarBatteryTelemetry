# Add under the existing mqtt: sensor: list; merge the existing mqtt key.
# Individual cells intentionally have no changing shared JSON attributes.
mqtt:
  sensor:
    - name: "SBT BMS Cell 01 Voltage"
      unique_id: sbt_bms_cell_01_voltage
      state_topic: SolarBatteryTelemetry/bms/cells
      value_template: "{{ (value_json.cells_mv[0] | float / 1000) if value_json.available and value_json.cells_mv is sequence and value_json.cells_mv | count == 14 else none }}"
      device_class: voltage
      state_class: measurement
      unit_of_measurement: V
      suggested_display_precision: 3
      availability_mode: all
      availability: &sbt_cells_availability
        - topic: SolarBatteryTelemetry/status
          payload_available: online
          payload_not_available: offline
        - topic: SolarBatteryTelemetry/bms/availability
          payload_available: available
          payload_not_available: unavailable
        - topic: SolarBatteryTelemetry/bms/cells
          value_template: "{{ 'online' if value_json.available | default(false) else 'offline' }}"
      device: &sbt_cells_device
        identifiers: [sbt_8857218f664c_bms]
    - name: "SBT BMS Cell 02 Voltage"
      unique_id: sbt_bms_cell_02_voltage
