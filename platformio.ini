[platformio]
default_envs = usb
description = ESP32 battery and solar charger telemetry preparation
extra_configs = platformio.local.ini

[env]
platform = platformio/espressif32@7.0.1
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCM_ENABLE_LOGGING=0
    -DCM_ENABLE_VERBOSE_LOGGING=0
lib_deps =
    vitaly.ruhl/ESP32 Configuration Manager@4.2.2
    knolleary/PubSubClient@2.8
extra_scripts = pre:tools/precompile_configmanager.py

[env:usb]

[env:ota]
upload_protocol = espota
