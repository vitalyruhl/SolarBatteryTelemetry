[platformio]
default_envs = usb
description = WiFi/UI/OTA BLE worker and read-only MQTT preparation
extra_configs = platformio.local.ini
build_dir = .pio/wifi-coex-1.4.8
libdeps_dir = .pio/wifi-coex-1.4.8/libdeps

[env]
platform = platformio/espressif32@7.0.1
board = nodemcu-32s
board_build.partitions = partitions/dual-ota-1792k.csv
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -flto
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DMQTT_SOCKET_TIMEOUT=1
    -DCM_BLE_TX_MAX_BYTES=9
    -DCM_ENABLE_LOGGING=0
    -DCM_ENABLE_VERBOSE_LOGGING=0
    -DCM_DISABLE_GUI_LOGGING=1
    -DCM_ENABLE_LIVE_UI=0
    -DCM_ENABLE_SETTINGS_UI=1
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
    knolleary/PubSubClient@2.8
    file://.local/cm-wifi-coex-4.10.1-package
extra_scripts =
    pre:tools/precompile_configmanager.py
    post:tools/ble_lto.py

[env:usb]
upload_port = COM7
monitor_port = COM7

[env:ota]
upload_protocol = espota

[env:testesp]
extends = env:usb
upload_port = COM8
monitor_port = COM8
build_flags =
    ${env.build_flags}
    -DSBT_ISOLATED_TEST_PROFILE=1
    -DSBT_ENABLE_HEAP_DIAGNOSTICS=1
    -Wl,--wrap=sys_thread_sem_get
