[platformio]
default_envs = usb
description = WiFi/UI/OTA and optional BLE-worker smoke test
extra_configs = platformio.local.ini
build_dir = .pio/ble-smoke
libdeps_dir = .pio/ble-smoke/libdeps

[env]
platform = platformio/espressif32@7.0.1
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -flto
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED
    -DCM_ENABLE_LOGGING=0
    -DCM_ENABLE_VERBOSE_LOGGING=0
lib_deps =
    h2zero/NimBLE-Arduino@2.5.1
extra_scripts =
    pre:tools/precompile_configmanager.py
    post:tools/ble_lto.py

[env:usb]

[env:ota]
upload_protocol = espota
